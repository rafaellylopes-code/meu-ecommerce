<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Checkout - HYPE DROP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-main">
        <a href="index.html" class="logo">
            HYPE <span>DROP</span>
        </a>

        <div class="search-box">
            <input type="text" id="campo-busca" placeholder="O que você procura?">
        </div>
        
        <details class="menu-sanduiche">
            <summary>☰</summary>
            <ul>
                <li><a href="index.html">Lançamentos</a></li>
                <li><a href="produto.html">Produtos</a></li>
                <li><a href="carrinho.html">Meu Carrinho</a></li>
                <li><a href="cadastro.html">Minha Conta</a></li>
            </ul>
        </details>
    </header>

    <main class="cadastro-main">
        <h2>Finalizar Pedido</h2>

        <form action="#" method="POST" class="form-cadastro">
            
            <!-- BLOCO 1 - DADOS PESSOAIS -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-grupo">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="email-cliente">E-mail:</label>
                        <input type="email" id="email-cliente" name="email" placeholder="exemplo@email.com" required>
                    </div>
                    <div class="form-grupo">
                        <label for="cpf-cliente">CPF:</label>
                        <input type="text" id="cpf-cliente" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite o CPF no formato 000.000.000-00" required>
                    </div>
                </div>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="tel-cliente">Telefone / WhatsApp:</label>
                        <input type="tel" id="tel-cliente" name="telefone" placeholder="(00) 99999-9999" required>
                    </div>
                    <div class="form-grupo">
                        <label for="data-nasc">Data de Nascimento:</label>
                        <input type="date" id="data-nasc" name="data_nascimento" required>
                    </div>
                </div>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="senha-cliente">Senha:</label>
                        <input type="password" id="senha-cliente" name="senha" minlength="6" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <div class="form-grupo">
                        <label for="foto-perfil">Foto de Perfil / Avatar (Opcional):</label>
                        <input type="file" id="foto-perfil" name="avatar" accept="image/*">
                    </div>
                </div>
            </fieldset>

            <!-- BLOCO 2 - ENDEREÇO DE ENTREGA -->
            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="cep-entrega">CEP:</label>
                        <input type="text" id="cep-entrega" name="cep" placeholder="00000-000" required>
                    </div>
                    <div class="form-grupo" style="flex: 2;">
                        <label for="rua-entrega">Rua / Logradouro:</label>
                        <input type="text" id="rua-entrega" name="rua" placeholder="Av. Paulista, etc." required>
                    </div>
                </div>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="num-entrega">Número:</label>
                        <input type="text" id="num-entrega" name="numero" required>
                    </div>
                    <div class="form-grupo">
                        <label for="comp-entrega">Complemento:</label>
                        <input type="text" id="comp-entrega" name="complemento" placeholder="Apto, Bloco, etc.">
                    </div>
                </div>

                <div class="form-linha-dupla">
                    <div class="form-grupo">
                        <label for="bairro-entrega">Bairro:</label>
                        <input type="text" id="bairro-entrega" name="bairro" required>
                    </div>
                    <div class="form-grupo">
                        <label for="cidade-entrega">Cidade:</label>
                        <input type="text" id="cidade-entrega" name="cidade" required>
                    </div>
                    <div class="form-grupo">
                        <label for="estado-entrega">Estado:</label>
                        <select id="estado-entrega" name="estado" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="Outro">Outro Estado</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- BLOCO 3 - FORMA DE PAGAMENTO -->
            <fieldset>
                <legend>Forma de Pagamento</legend>

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="pix" required>
                    <span class="icone-pagamento">📱</span>
                    <strong>PIX</strong> (Aprovação imediata com 5% de desconto)
                </label>

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="cartao">
                    <span class="icone-pagamento">💳</span>
                    <strong>Cartão de Crédito</strong> (Até 12x sem juros)
                </label>

                <label class="pagamento-opcao">
                    <input type="radio" name="pagamento" value="boleto">
                    <span class="icone-pagamento">📄</span>
                    <strong>Boleto Bancário</strong> (Até 3 dias úteis para compensar)
                </label>
            </fieldset>

            <!-- TERMOS E ENVIO -->
            <div class="termos-container">
                <input type="checkbox" id="termos-uso" name="termos" required>
                <label for="termos-uso">Aceito os Termos de Uso e as Políticas da loja.</label>
            </div>

            <button type="submit" class="btn-submit-cadastro">Concluir Cadastro e Pagar</button>
        </form>
    </main>

</body>
</html>

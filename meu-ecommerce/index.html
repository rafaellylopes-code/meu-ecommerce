
<!DOCTYPE html>

<body>

    <header class="header-main">

        <details class="menu-sanduiche">

    <section class="hero">

            <img src="img/ENTRADA.webp" alt="Banner principal Hype Drop exibindo o anúncio Restock sobre o tênis OUS">
        </picture>
    </section>
   
    <section class="categorias-container">
       <h1>Compre por Categoria</h1>
        
        <div class="grade-categorias">
            <a href="produto.html" class="item-categoria destaque-yeezy">
                <div class="circulo-midia">
                    <img src="img/airyeezy.jpg" alt="Categoria Lançamentos Ícones: Tênis Air Yeezy em destaque circular">
                </div>
                <span class="texto-yeezy">★ Air Yeezy ★</span>
            </a>

            <a href="produto.html" class="item-categoria">
                <div class="circulo-midia">
                    <img src="img/nike.jpg" alt="Categoria Ofertas Especiais: Tênis Nike esportivo">
                </div>

                <div class="circulo-midia">
                    <img src="img/TENISOUS.webp" alt="Categoria Mais Vendidos: Tênis OUS urbano">
                </div>
                <span>Mais Vendidos</span>
            </a>
        </div>
    </section>

    <section class="vitrine-produtos">
        <h2>Destaques Hype Drop</h2>
        
        <div class="produtos-grid">
            
            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/tnt.jpg" alt="Supreme Snakeskin">

                    </figcaption>
                    </figure>
                    
                </a>
                                        <button class="btn-comprar">Comprar</button>

            </article>

            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/nike.jpg" alt="Tênis Nike Performance casual esportivo">
                        <figcaption class="produto-detalhes">
                        <h3>Nike Street Purple</h3>
                        <p class="preco">R$ 789,90</p>
                        
                    </figcaption>
                    </figure>
                    
                </a>
                <button class="btn-comprar">Comprar</button>
            </article>
       
            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/TENISOUS.webp" alt="Tênis OUS de camurça urbano">
                         <figcaption class="produto-detalhes">
                        <h3>OUS Camurça Classic</h3>
                        <p class="preco">R$ 549,90</p>
                    </figcaption>
                    </figure>
                   
                </a>
                                        <button class="btn-comprar">Comprar</button>

            </article>

            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/airyeezy.jpg" alt="Tênis Air Yeezy modelo Blackout">
                        <figcaption class="produto-detalhes">
                        <h3><span class="texto-yeezy">★ Air Yeezy ★</span></h3>
                        <p class="preco">R$ 1.599,90</p>
                        
                    </figcaption>
                    </figure>
                    
                </a>
                <button class="btn-comprar">Comprar</button>
            </article>
        
            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/RED.webp" alt="Tênis Nike Running de corrida vermelho">
                         <figcaption class="produto-detalhes">
                        <h3>Nike Run Red</h3>
                        <p class="preco">R$ 699,90</p>
                    </figcaption>
                    </figure>
        
                   

                </a>
                 <button class="Comprar"></button>
            </article>
           
            <article class="produto-card">
                <a href="produto.html" style="text-decoration: none; color: inherit;">
                    <figure class="produto-midia">
                        <img src="img/vans.jpg" alt="Tênis OUS modelo especial Skateboarding">
                        <figcaption class="produto-detalhes">
                        <h3>Vans Knu</h3>

                    </figcaption>
                    </figure>
                    
                </a>
                <button class="btn-comprar">Comprar</button>
            </article>

            <article class="produto-card card-esgotado">
                <figure class="produto-midia">
                    <img src="img/reto.jpg" alt="Tênis Air Yeezy modelo Blackout - PRODUTO INDISPONÍVEL E ESGOTADO" loading="lazy">
                     <figcaption class="produto-detalhes">
                    <h3>Air Yeezy Blackout</h3>
                    <p class="status-esgotado">Esgotado</p> 
                    <p class="preco">R$ 499,90</p>
                    <button class="btn-comprar btn-indisponivel" disabled>Indisponível</button>
                </figcaption>
                </figure>
               
            </article>
            
        </div>
    </section>

      <script>
        const campoBusca = document.getElementById('campo-busca');
        const produtos = document.querySelectorAll('.produto-card');

        campoBusca.addEventListener('input', () => {
            const termoBusca = campoBusca.value.toLowerCase().trim();

            produtos.forEach(produto => {
                const nomeProduto = produto.querySelector('h3').textContent.toLowerCase();

                if (nomeProduto.includes(termoBusca)) {
                    produto.style.display = 'flex';
                } else {
                    produto.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
